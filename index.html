<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0c0b">
  <meta name="description" content="A morning weather report that preps you for your day.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Home Life">
  <title>Home Life</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400;1,6..72,500&display=swap">
  <link rel="stylesheet" href="./styles.css">
  <script>
    // Apply a saved theme before first paint so there is no flash.
    try {
      var s = JSON.parse(localStorage.getItem('hl.settings') || '{}');
      if (s.theme === 'dark' || s.theme === 'light') document.documentElement.setAttribute('data-theme', s.theme);
    } catch (e) { /* storage blocked */ }
  </script>
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main class="layout">
    <div class="col col-a">
      <section id="hero" class="card hero" aria-label="today"></section>
      <section id="plan" class="card plan" aria-label="trip plan" hidden></section>
      <section id="rundown" class="card rundown" aria-label="the rundown" hidden></section>
      <section id="fine" class="card fine" aria-label="the fine print" hidden></section>
    </div>
    <div class="col col-b">
      <section id="hourly" class="card hourly" aria-label="hour by hour and your day" hidden></section>
      <section id="week" class="card week" aria-label="the week" hidden></section>
    </div>
  </main>
  <dialog id="settings" class="sheet" aria-labelledby="settings-title"></dialog>
  <dialog id="plan-sheet" class="sheet" aria-labelledby="plan-sheet-title"></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <noscript><p class="noscript">Home Life needs JavaScript to read the sky.</p></noscript>
</body>
</html>
